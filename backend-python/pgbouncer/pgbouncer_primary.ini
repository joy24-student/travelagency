[databases]
shopnojatra = host=postgres_primary port=5432 dbname=shopnojatra auth_user=postgres

[pgbouncer]
logfile = /var/log/pgbouncer/pgbouncer_primary.log
pidfile = /var/run/pgbouncer/pgbouncer_primary.pid
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres
stats_users = postgres

;; Connection Pool Architecture: 10,000 clients sharing 100 backend threads
pool_mode = transaction
max_client_conn = 10000
default_pool_size = 100
min_pool_size = 20
reserve_pool_size = 20
reserve_charge_time = 5
max_db_connections = 120

;; Statement and rogue query timeouts (10s for booking transactions)
query_timeout = 10
query_wait_timeout = 120
client_idle_timeout = 60
server_idle_timeout = 60
server_connect_timeout = 15
server_login_retry = 15

;; TCP socket optimization for high-concurrency throughput
tcp_keepalive = 1
tcp_keepidle = 30
tcp_keepinterval = 10
tcp_keepcnt = 3

;; Asyncpg & ORM statement parameter handling
server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits,search_path
application_name_add_host = 1
