[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "shopno-jatra-backend-python"
version = "1.0.0"
description = "High-Performance Asynchronous Python Backend for Shopno Jatra Travel Ecosystem"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.32",
    "greenlet>=3.0.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.8",
    "slowapi>=0.1.9",
    "orjson>=3.10.7",
    "prometheus-client>=0.20.0",
    "pyjwt[crypto]>=2.9.0",
    "cryptography>=43.0.0",
    "google-genai>=2.30.1",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "celery[redis]>=5.4.0",
    "reportlab>=4.2.0",
    "qrcode[pil]>=7.4.2",
    "pillow>=10.4.0",
    "brotli>=1.1.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = "test_*.py"


